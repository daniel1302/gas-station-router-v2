rpc:
  host: 0.0.0.0
  port: 9257
  token: ${GS_AUTH}

metrics:
  host: 0.0.0.0
  port: 9184

iota:
  rpc_url: ${IOTA_RPC_URL}
  timeout: 5s

storage:
  kind: memory # memory | redis (not implemented yet)
  redis:
    url: ${REDIS_URL}
    key_prefix: gas-station-router

routing:
  algorithm: round_robin
  reserve_gas:
    timeout: 3s
    retries:
      max_retries: 2
      backoff: 200ms
  execute_tx:
    timeout: 30s

    inflight:
      lease_ttl: 45s
      record_ttl: 30m

  ttl:
    reservation: 15m
    transaction_effects: 30m

backends:
  - name: gas_station_a
    enabled: true
    token: ""
    rpc: http://localhost:9258

  - name: gas_station_b
    enabled: true
    token: ${GAS_STATION_B_TOKEN}
    rpc: http://localhost:9259

  - name: gas_station_c
    enabled: false
    token: "..."
    rpc: http://localhost:9260
